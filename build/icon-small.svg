<?xml version="1.0" encoding="UTF-8"?>
<!--
  The same icon drawn for the 16 and 32 point slots, where the full artwork
  turns to mush: nine fat bars instead of thirty-seven, no aluminium grain, no
  vignette, and heavier lines on everything that has to survive being four
  pixels wide. Keep it in step with icon.svg when that changes.
-->
