# Dependabot configuration
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # pnpm workspace at the repo root; "npm" is the ecosystem name Dependabot
  # uses for pnpm lockfiles too.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      js-dependencies:
        patterns:
          - "*"
  # The Tauri frontend, which Bun manages on its own lockfile.
  - package-ecosystem: "bun"
    directory: "/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      ui-dependencies:
        patterns:
          - "*"
  # The actions the workflows in .github/workflows use.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
