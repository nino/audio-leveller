name: Release

# Signed, notarised macOS build of the apps: Audio Leveller from the Tauri
# bundler, Listen from `cargo xtask bundle` until it moves to Tauri too. Tag a
# version and the DMG and Audio Leveller's update feed land on a GitHub release
# page; a manual run does the same work and leaves them as a run artifact
# instead, which is how you test the pipeline without burning a version number.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Two runs of the same tag would race over the release, and a half-finished
# notarisation is not something to cancel — so queue rather than supersede.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# `gh release create` needs to write to the repository.
permissions:
  contents: write

jobs:
  mac:
    name: Signed DMG (Apple Silicon)
    # macos-latest is an Apple Silicon runner, and the bundles are built for
    # the host, so this is what decides the architecture that ships.
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup update --no-self-update stable && rustup default stable && rustc --version

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/.bun-version

      - name: Install the frontend's dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      # A tag that disagrees with the workspace version produces a release
      # called v0.3.0 holding a DMG called 0.2.0. Catch it before anything is
      # signed. xtask takes the bundle version from the same place.
      - name: Check the tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "xtask") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi

      # notarytool wants the App Store Connect key as a file, so the secret has
      # to land on disk. RUNNER_TEMP dies with the runner, and the last step
      # removes it regardless of how the job ends.
      - name: Write the App Store Connect key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::error::APPLE_API_KEY_P8 is not set (see README, 'Signed releases')"
            exit 1
          fi
          umask 077
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"

      # A keychain of its own, unlocked with a password generated here, so
      # codesign never stops to ask. The identity's hash goes into the
      # environment: it names exactly one certificate, where the common name
      # could match an expired one left in the search list.
      - name: Import the signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 is not set (see README, 'Signed releases')"
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          certificate="$RUNNER_TEMP/certificate.p12"

          umask 077
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$certificate"

          security find-identity -v -p codesigning "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk '/Developer ID Application/ { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "::error::the certificate holds no Developer ID Application identity — wrong export?"
            exit 1
          fi
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      # Listen, release profile, signed with the hardened runtime. No
      # entitlements: a statically linked Rust binary needs none of the JIT and
      # library-validation exceptions Electron did.
      - name: Build and sign Listen
        run: |
          cargo xtask bundle
          cargo xtask sign "$SIGNING_IDENTITY"

      # Apple's service takes a zip.
      - name: Notarise and staple Listen
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          ditto -c -k --keepParent target/bundle "$RUNNER_TEMP/bundles.zip"
          .github/scripts/notarise "$RUNNER_TEMP/bundles.zip"
          for app in target/bundle/*.app; do
            xcrun stapler staple "$app"
          done

      # The updater archive is made only here, so a local `tauri build` needs
      # no key. Every update is signed with the updater key, and the app
      # refuses one whose signature does not match the public key it was built
      # with. A tag build needs the real key. A manual run without it makes a
      # throwaway pair and builds against that public key, so the pipeline can
      # be tested before the secret exists; what it produces can't update
      # anyone.
      - name: Choose the update signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo '{"bundle": {"createUpdaterArtifacts": true}}' > "$RUNNER_TEMP/updater-config.json"
            exit 0
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set (see README, 'Signed releases')"
            exit 1
          fi
          echo "::warning::no TAURI_SIGNING_PRIVATE_KEY, so this build signs its update with a throwaway key"
          (cd ui && bun run tauri signer generate --ci -p "" -w "$RUNNER_TEMP/throwaway.key" -f)
          jq -n --arg key "$(cat "$RUNNER_TEMP/throwaway.key.pub")" \
            '{bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: $key}}}' \
            > "$RUNNER_TEMP/updater-config.json"
          echo "THROWAWAY_UPDATER_KEY=$RUNNER_TEMP/throwaway.key" >> "$GITHUB_ENV"

      # The Tauri bundler builds the frontend, then the app, signs it with the
      # hardened runtime, notarises and staples it, and packs the stapled app
      # into a signed .app.tar.gz for the updater.
      - name: Build, sign and notarise Audio Leveller
        working-directory: ui
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          export APPLE_SIGNING_IDENTITY="$SIGNING_IDENTITY"
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/apple-api-key.p8"
          if [ -n "${THROWAWAY_UPDATER_KEY:-}" ]; then
            export TAURI_SIGNING_PRIVATE_KEY=$(cat "$THROWAWAY_UPDATER_KEY")
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          fi
          bun run tauri build --bundles app --config "$RUNNER_TEMP/updater-config.json"
          ditto "../target/release/bundle/macos/Audio Leveller.app" "../target/bundle/Audio Leveller.app"

      # The feed the installed app reads, through
      # releases/latest/download/latest-audio-leveller.json. The archive is
      # renamed because GitHub turns the space in an asset's name into a dot,
      # and the feed has to name the URL exactly.
      - name: Write the update feed
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "audio-leveller-tauri") | .version')
          mkdir -p target/updates
          archive="Audio-Leveller-$version-arm64.app.tar.gz"
          cp "target/release/bundle/macos/Audio Leveller.app.tar.gz" "target/updates/$archive"
          jq -n \
            --arg version "$version" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat "target/release/bundle/macos/Audio Leveller.app.tar.gz.sig")" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$version/$archive" \
            '{
              version: $version,
              notes: "See the release page for what changed.",
              pub_date: $date,
              platforms: { "darwin-aarch64": { signature: $signature, url: $url } }
            }' > target/updates/latest-audio-leveller.json
          cat target/updates/latest-audio-leveller.json

      # The disk image is made from the stapled apps, so someone who drags them
      # out offline still has the tickets. Then the image is signed and
      # notarised in its own right, so mounting it needs no network either.
      - name: Build, sign, notarise and staple the disk image
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          dmg=$(cargo xtask dmg | tail -n 1)
          codesign --timestamp --sign "$SIGNING_IDENTITY" "$dmg"
          .github/scripts/notarise "$dmg"
          xcrun stapler staple "$dmg"
          echo "DMG=$dmg" >> "$GITHUB_ENV"

      # What a downloader's Mac will check, checked here instead: signatures
      # whole, Developer ID, hardened runtime, tickets attached, and Gatekeeper
      # accepting both the app and the image it arrives in.
      - name: Verify the signatures and the tickets
        run: |
          for app in target/bundle/*.app; do
            codesign --verify --strict --verbose=2 "$app"

            signature=$(codesign --display --verbose=4 "$app" 2>&1)
            echo "$signature" | grep -E "Authority|TeamIdentifier|flags="
            if ! echo "$signature" | grep -q "Authority=Developer ID Application"; then
              echo "::error::$app is not signed with a Developer ID Application certificate"
              exit 1
            fi
            if ! echo "$signature" | grep -q "flags=.*runtime"; then
              echo "::error::$app does not have the hardened runtime"
              exit 1
            fi

            xcrun stapler validate "$app"

            assessment=$(spctl --assess --type exec -vv "$app" 2>&1)
            echo "$assessment"
            if ! echo "$assessment" | grep -q "source=Notarized Developer ID"; then
              echo "::error::Gatekeeper does not see $app as a notarised Developer ID app"
              exit 1
            fi
          done

          xcrun stapler validate "$DMG"
          assessment=$(spctl --assess --type open --context context:primary-signature -vv "$DMG" 2>&1)
          echo "$assessment"
          if ! echo "$assessment" | grep -q "source=Notarized Developer ID"; then
            echo "::error::Gatekeeper does not see the disk image as notarised Developer ID"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: audio-leveller-macos-arm64
          path: |
            ${{ env.DMG }}
            target/updates/*
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$DMG" target/updates/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Remove the signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/apple-api-key.p8" "$RUNNER_TEMP/certificate.p12" \
            "$RUNNER_TEMP/throwaway.key" "$RUNNER_TEMP/throwaway.key.pub"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
