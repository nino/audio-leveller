name: Release

# Signed, notarised macOS build. Tag a version and the DMG lands on a GitHub
# release page you can send someone; a manual run does the same work and leaves
# the DMG as a run artifact instead, which is how you test the pipeline without
# burning a version number.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Two runs of the same tag would race over the release, and a half-finished
# notarisation is not something to cancel — so queue rather than supersede.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# `gh release create` needs to write to the repository.
permissions:
  contents: write

jobs:
  mac:
    name: Signed DMG (Apple Silicon)
    # macos-latest is an Apple Silicon runner, which is the arch we ship:
    # onnxruntime-node's install script only fetches binaries for the host, so
    # building where we ship is what keeps the ONNX backend in the bundle.
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Unlike CI, this install must be the real thing: the Electron binary and
      # onnxruntime's native dylib are precisely what gets signed here.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A tag that disagrees with package.json produces a release called v0.2.0
      # holding a DMG called 0.1.0. Catch it before anything is signed.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # notarytool wants the App Store Connect key as a file, so the secret has
      # to land on disk. RUNNER_TEMP dies with the runner, and the last step
      # removes it regardless of how the job ends.
      - name: Write the App Store Connect key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::error::APPLE_API_KEY_P8 is not set (see README, 'Signed releases')"
            exit 1
          fi
          umask 077
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"

      # The certificate is imported here rather than by electron-builder,
      # because the way electron-builder does it is wrong: it hands
      # `security set-key-partition-list` the .p12 password where the
      # keychain's own password belongs. macOS 26 rejects that outright
      # (SecKeychainUnlock), and the line is unchanged in electron-builder 26,
      # so the runner's OS version would decide whether a release builds.
      # Given no CSC_LINK, electron-builder skips its own keychain handling and
      # searches CSC_KEYCHAIN instead — which is the one built here.
      - name: Import the signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 is not set (see README, 'Signed releases')"
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          certificate="$RUNNER_TEMP/certificate.p12"

          umask 077
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$certificate"

          security find-identity -v -p codesigning "$keychain"
          if ! security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application"; then
            echo "::error::the certificate holds no Developer ID Application identity — wrong export?"
            exit 1
          fi

      # Hardened runtime is on, and electron-builder's default entitlements
      # cover what Electron and a loaded ONNX dylib need: JIT, unsigned
      # executable memory, and library validation off. Notarisation of the .app
      # happens here, from the API key written above.
      - name: Build, sign and notarise the app
        env:
          CSC_KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          pnpm build
          pnpm exec electron-builder --mac --publish never

      # The step above notarises the .app; the disk image around it carries no
      # ticket of its own, so Gatekeeper has to phone home the first time
      # someone mounts it — and refuses if they are offline. One more
      # submission and a staple makes the DMG self-contained.
      - name: Notarise and staple the disk image
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          shopt -s nullglob
          dmgs=(release/*.dmg)
          if [ ${#dmgs[@]} -ne 1 ]; then
            echo "::error::expected exactly one DMG in release/, found ${#dmgs[@]}"
            exit 1
          fi
          xcrun notarytool submit "${dmgs[0]}" \
            --key "$RUNNER_TEMP/apple-api-key.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "${dmgs[0]}"

      # What a downloader's Mac will check, checked here instead: the signature
      # is whole, the ticket is attached, and Gatekeeper opens it.
      - name: Verify the signature and the ticket
        run: |
          shopt -s nullglob
          dmgs=(release/*.dmg)
          apps=(release/mac*/*.app)
          if [ ${#apps[@]} -ne 1 ] || [ ${#dmgs[@]} -ne 1 ]; then
            echo "::error::expected one app and one DMG, found ${#apps[@]} and ${#dmgs[@]}"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "${apps[0]}"

          signature=$(codesign --display --verbose=4 "${apps[0]}" 2>&1)
          echo "$signature" | grep -E "Authority|TeamIdentifier|flags="
          if ! echo "$signature" | grep -q "Authority=Developer ID Application"; then
            echo "::error::not signed with a Developer ID Application certificate"
            exit 1
          fi
          if ! echo "$signature" | grep -q "flags=.*runtime"; then
            echo "::error::hardened runtime is not enabled"
            exit 1
          fi

          # Both tickets: the one stapled to the app, and the one stapled to the
          # disk image around it. For the DMG this is the whole check available.
          # spctl wants a signature on the disk image, and electron-builder
          # leaves disk images unsigned on purpose — its own schema says signing
          # them "will lead to unwanted errors in combination with notarization
          # requirements" — so asking spctl about the DMG only ever gets back
          # "no usable signature", ticket or no ticket.
          xcrun stapler validate "${apps[0]}"
          xcrun stapler validate "${dmgs[0]}"

          # What Gatekeeper actually does when someone runs the app they dragged
          # out of that disk image.
          assessment=$(spctl --assess --type exec -vv "${apps[0]}" 2>&1)
          echo "$assessment"
          if ! echo "$assessment" | grep -q "source=Notarized Developer ID"; then
            echo "::error::Gatekeeper does not see a notarised Developer ID app"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: audio-leveller-macos-arm64
          path: release/*.dmg
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.dmg \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Remove the signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/apple-api-key.p8" "$RUNNER_TEMP/certificate.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
