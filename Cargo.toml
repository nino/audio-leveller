[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
authors = ["Nino Annighoefer"]
license = "MIT"
repository = "https://github.com/nino/audio-leveller"

[workspace.dependencies]
leveller-dsp = { path = "crates/leveller-dsp" }

anyhow = "1.0"
rayon = "1.12"
realfft = "3.5"
rustfft = "6.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# The DSP is only worth testing at speed; debug builds of it are unusably slow
# on a real recording.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
